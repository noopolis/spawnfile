name: runtime images

on:
  pull_request:
    paths:
      - "runtime-images/**"
      - "runtimes.yaml"
      - "moltnet-releases.json"
      - "src/runtime/**/image/**"
      - "src/runtime/**/contract-manifest.*"
      - "src/runtime/**/contractManifest.ts"
      - "src/runtime/*/install.ts"
      - "src/runtime/daimon/daimonInstall.ts"
      - "src/compiler/moltnetReleaseAuthority.ts"
      - "src/compiler/moltnetReleaseDownload.ts"
      - "src/runtime/container.ts"
      - "src/runtime/install.ts"
      - "scripts/runtime-image-catalog.ts"
      - "scripts/build-runtime-images.ts"
      - "scripts/publish-daimon-runtime.ts"
      - "scripts/build-local-daimon-runtime.ts"
      - ".github/workflows/runtime-images.yml"
  push:
    branches: [main]
    paths:
      - "runtime-images/**"
      - "runtimes.yaml"
      - "moltnet-releases.json"
      - "src/runtime/**/image/**"
      - "src/runtime/**/contract-manifest.*"
      - "src/runtime/**/contractManifest.ts"
      - "src/runtime/*/install.ts"
      - "src/runtime/daimon/daimonInstall.ts"
      - "src/compiler/moltnetReleaseAuthority.ts"
      - "src/compiler/moltnetReleaseDownload.ts"
      - "src/runtime/container.ts"
      - "src/runtime/install.ts"
      - "scripts/runtime-image-catalog.ts"
      - "scripts/build-runtime-images.ts"
      - "scripts/publish-daimon-runtime.ts"
      - "scripts/build-local-daimon-runtime.ts"
      - ".github/workflows/runtime-images.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime image name, or all"
        required: true
        default: all
        type: string
      push:
        description: "Push runtime images to Docker Hub"
        required: true
        default: "false"
        type: boolean
      push_latest:
        description: "Also publish/update the latest tag"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    name: Discover runtime images
    runs-on: ubuntu-latest
    outputs:
      # Job outputs carry runtime IDs only. Build settings are read in each build job.
      dockerfiles: ${{ steps.images.outputs.dockerfiles }}
      scripted: ${{ steps.images.outputs.scripted }}
      push: ${{ steps.publish.outputs.push }}
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read adapter image metadata
        id: images
        env:
          RUNTIME_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime || 'all' }}
        run: node --experimental-strip-types scripts/runtime-image-catalog.ts "${RUNTIME_SELECTION}"

      - name: Resolve publishing mode
        id: publish
        shell: bash
        env:
          REQUEST_PUSH: ${{ inputs.push }}
          REQUEST_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          should_push=false
          push_latest=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            should_push=true
            push_latest=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${REQUEST_PUSH}" == "true" ]]; then
              should_push=true
            fi
            if [[ "${REQUEST_LATEST}" == "true" ]]; then
              push_latest=true
            fi
          fi

          {
            echo "push=${should_push}"
            echo "latest=${push_latest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check Docker Hub credentials
        if: steps.publish.outputs.push == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets must be configured in noopolis/spawnfile to publish runtime images."
            exit 1
          fi

  build:
    name: ${{ matrix.runtime }} runtime image
    needs: catalog
    if: needs.catalog.outputs.dockerfiles != '' && needs.catalog.outputs.dockerfiles != '[]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.catalog.outputs.dockerfiles) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve adapter build metadata
        id: image
        env:
          RUNTIME_NAME: ${{ matrix.runtime }}
        run: node --experimental-strip-types scripts/runtime-image-catalog.ts "${RUNTIME_NAME}" --job-metadata dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
          LATEST: ${{ needs.catalog.outputs.latest }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [[ "${LATEST}" == "true" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        if: needs.catalog.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.catalog.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.image.outputs.build_args }}

  scripted:
    name: ${{ matrix.runtime }} runtime image
    needs: catalog
    if: needs.catalog.outputs.scripted != '' && needs.catalog.outputs.scripted != '[]'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.catalog.outputs.scripted) }}
    # A pinned tag can be published from multiple refs. Serialize that image's
    # publisher across refs so checking for the tag and writing it cannot race.
    concurrency:
      group: runtime-images-${{ matrix.runtime }}-publish
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve adapter build metadata
        id: image
        env:
          RUNTIME_NAME: ${{ matrix.runtime }}
        run: node --experimental-strip-types scripts/runtime-image-catalog.ts "${RUNTIME_NAME}" --job-metadata scripted

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.catalog.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build scripted runtime image
        shell: bash
        env:
          RUNTIME_NAME: ${{ matrix.runtime }}
          PUBLISHER: ${{ steps.image.outputs.publisher }}
          PUSH: ${{ needs.catalog.outputs.push }}
          LATEST: ${{ needs.catalog.outputs.latest }}
        run: |
          set -euo pipefail
          args=(--identity-out "${RUNNER_TEMP}/${RUNTIME_NAME}-runtime-identity.json")
          if [[ "${PUSH}" == "true" ]]; then
            args+=(--push)
            if [[ "${LATEST}" == "true" ]]; then
              args+=(--latest)
            fi
          fi
          node --experimental-strip-types "${PUBLISHER}" "${args[@]}" | tee "${RUNNER_TEMP}/${RUNTIME_NAME}-publish.log"

      - name: Record published identity
        if: needs.catalog.outputs.push == 'true'
        shell: bash
        env:
          RUNTIME_NAME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          identity="${RUNNER_TEMP}/${RUNTIME_NAME}-runtime-identity.json"
          log="${RUNNER_TEMP}/${RUNTIME_NAME}-publish.log"
          if [[ -s "${identity}" ]]; then
            {
              echo "### Published ${RUNTIME_NAME} runtime identity"
              echo '```json'
              cat "${identity}"
              echo '```'
              echo "Pin it in runtimes.yaml:"
              echo '```yaml'
              sed -n '/^runtimes.yaml pin:$/,$p' "${log}" | tail -n +2
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          elif grep -q "already exists; refusing to move a published tag" "${log}"; then
            echo "${RUNTIME_NAME} runtime tag already published; nothing new to record." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::error::Publishing finished without a ${RUNTIME_NAME} runtime identity."
            exit 1
          fi

      - name: Upload published identity
        if: needs.catalog.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}-runtime-identity
          path: ${{ runner.temp }}/${{ matrix.runtime }}-runtime-identity.json
          if-no-files-found: ignore
