name: runtime images

on:
  pull_request:
    paths:
      - "runtime-images/**"
      - "runtimes.yaml"
      - "src/runtime/container.ts"
      - "src/runtime/install.ts"
      - ".github/workflows/runtime-images.yml"
  push:
    branches: [main]
    paths:
      - "runtime-images/**"
      - "runtimes.yaml"
      - "src/runtime/container.ts"
      - "src/runtime/install.ts"
      - ".github/workflows/runtime-images.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push runtime images to Docker Hub"
        required: true
        default: "false"
        type: boolean
      push_latest:
        description: "Also publish/update the latest tag"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.runtime }} runtime image
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: openclaw
            image: noopolis/spawnfile-runtime-openclaw
            version: 2026.6.11
            context: runtime-images/openclaw
            build_args: |
              OPENCLAW_VERSION=2026.6.11
          - runtime: picoclaw
            image: noopolis/spawnfile-runtime-picoclaw
            version: 0.3.1
            context: runtime-images/picoclaw
            build_args: |
              PICOCLAW_VERSION=v0.3.1
          # The Daimon runtime image is deliberately absent from this matrix.
          # It cannot be built by a plain `docker build` of a context: the
          # Dockerfile opens with `FROM daimon_package` and needs a
          # `--build-context` carrying a packed Daimon tarball, plus a
          # capability receipt, three content digests, and eight pinned CLI
          # artifact URLs and hashes. It also hard-pins linux/amd64, which
          # contradicts this job's two-platform build. The entry that used to
          # sit here passed DAIMON_VERSION/MNEME_VERSION/PI_VERSION — three
          # args the Dockerfile does not declare — so it had never produced an
          # image, only a red check.
          #
          # `npm run build:local-daimon` (scripts/build-local-daimon-runtime.mjs)
          # assembles all of that and is the supported path today. Publishing
          # from CI means teaching this workflow to call that script with a
          # non-loopback registry target, which `resolveLocalImageTag` currently
          # refuses by design.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve publishing mode
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          should_push=false
          push_latest=false

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            should_push=true
            push_latest=true
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.push }}" == "true" ]]; then
              should_push=true
            fi
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              push_latest=true
            fi
          fi

          tags="${{ matrix.image }}:${{ matrix.version }}"
          if [[ "${push_latest}" == "true" ]]; then
            tags="${tags}"$'\n'"${{ matrix.image }}:latest"
          fi

          {
            echo "push=${should_push}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Check Docker Hub credentials
        if: steps.publish.outputs.push == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets must be configured in noopolis/spawnfile to publish runtime images."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.publish.outputs.tags }}
          build-args: ${{ matrix.build_args }}
