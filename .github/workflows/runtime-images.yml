name: runtime images

on:
  pull_request:
    paths:
      - "runtime-images/**"
      - "runtimes.yaml"
      - "src/runtime/container.ts"
      - "src/runtime/install.ts"
      - "src/runtime/daimon/contract-manifest.json"
      - "src/runtime/daimon/contract-manifest.sha256"
      - "scripts/publish-daimon-runtime.ts"
      - "scripts/daimon-publish-inputs.ts"
      - "scripts/build-local-daimon-runtime.ts"
      - ".github/workflows/runtime-images.yml"
  push:
    branches: [main]
    paths:
      - "runtime-images/**"
      - "runtimes.yaml"
      - "src/runtime/container.ts"
      - "src/runtime/install.ts"
      - "src/runtime/daimon/contract-manifest.json"
      - "src/runtime/daimon/contract-manifest.sha256"
      - "scripts/publish-daimon-runtime.ts"
      - "scripts/daimon-publish-inputs.ts"
      - "scripts/build-local-daimon-runtime.ts"
      - ".github/workflows/runtime-images.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push runtime images to Docker Hub"
        required: true
        default: "false"
        type: boolean
      push_latest:
        description: "Also publish/update the latest tag"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.runtime }} runtime image
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: openclaw
            image: noopolis/spawnfile-runtime-openclaw
            version: 2026.6.11
            context: runtime-images/openclaw
            build_args: |
              OPENCLAW_VERSION=2026.6.11
          - runtime: picoclaw
            image: noopolis/spawnfile-runtime-picoclaw
            version: 0.3.1
            context: runtime-images/picoclaw
            build_args: |
              PICOCLAW_VERSION=v0.3.1
          # Daimon is built by the `daimon` job below: its image needs a packed
          # Daimon tarball per architecture plus a capability receipt, which a
          # plain context build cannot provide.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve publishing mode
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          should_push=false
          push_latest=false

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            should_push=true
            push_latest=true
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.push }}" == "true" ]]; then
              should_push=true
            fi
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              push_latest=true
            fi
          fi

          tags="${{ matrix.image }}:${{ matrix.version }}"
          if [[ "${push_latest}" == "true" ]]; then
            tags="${tags}"$'\n'"${{ matrix.image }}:latest"
          fi

          {
            echo "push=${should_push}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Check Docker Hub credentials
        if: steps.publish.outputs.push == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets must be configured in noopolis/spawnfile to publish runtime images."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.publish.outputs.tags }}
          build-args: ${{ matrix.build_args }}

  daimon:
    name: daimon runtime image
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Every ref publishes the same pinned tag, so serialize across refs: the
    # tag-exists guard is check-then-write and must not race another run.
    concurrency:
      group: runtime-images-daimon-publish
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve publishing mode
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          should_push=false
          push_latest=false

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            should_push=true
            push_latest=true
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.push }}" == "true" ]]; then
              should_push=true
            fi
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              push_latest=true
            fi
          fi

          {
            echo "push=${should_push}"
            echo "latest=${push_latest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check Docker Hub credentials
        if: steps.publish.outputs.push == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets must be configured in noopolis/spawnfile to publish runtime images."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Packs the pinned Daimon commit per architecture, builds both platforms,
      # and (when publishing) pushes them by digest and joins them in one index
      # tagged <daimon version>-<short commit>. An existing tag is never moved.
      - name: Build Daimon runtime image
        shell: bash
        env:
          PUSH: ${{ steps.publish.outputs.push }}
          LATEST: ${{ steps.publish.outputs.latest }}
        run: |
          set -euo pipefail

          args=(--identity-out "${RUNNER_TEMP}/daimon-runtime-identity.json")
          if [[ "${PUSH}" == "true" ]]; then
            args+=(--push)
            if [[ "${LATEST}" == "true" ]]; then
              args+=(--latest)
            fi
          fi
          node --experimental-strip-types scripts/publish-daimon-runtime.ts "${args[@]}" | tee "${RUNNER_TEMP}/daimon-publish.log"

      - name: Record published identity
        if: steps.publish.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail

          identity="${RUNNER_TEMP}/daimon-runtime-identity.json"
          if [[ -s "${identity}" ]]; then
            {
              echo "### Published Daimon runtime identity"
              echo '```json'
              cat "${identity}"
              echo '```'
              echo "Pin it in runtimes.yaml:"
              echo '```yaml'
              sed -n '/^runtimes.yaml pin:$/,$p' "${RUNNER_TEMP}/daimon-publish.log" | tail -n +2
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          elif grep -q "already exists; refusing to move a published tag" "${RUNNER_TEMP}/daimon-publish.log"; then
            echo "Daimon runtime tag already published; nothing new to record." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::error::Publishing finished without a Daimon runtime identity."
            exit 1
          fi

      - name: Upload published identity
        if: steps.publish.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daimon-runtime-identity
          path: ${{ runner.temp }}/daimon-runtime-identity.json
          if-no-files-found: ignore
