name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-message:
    name: Commit messages and author allowlist
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out pull request head with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check every pull request commit before install
        run: node .github/scripts/ci/commit-message.mts --range "origin/$GITHUB_BASE_REF..HEAD"
      - name: Test commit policy
        run: |
          mkdir -p .tmp-commit-check
          TMPDIR="$PWD/.tmp-commit-check" node --test .github/scripts/ci/commit-message.test.mts

  root:
    name: compiler + runtime tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
      DAIMON_SOURCE_ROOT: ${{ github.workspace }}/.tmp/daimon-source
    steps:
      - name: Check out Spawnfile
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: mkdir -p "$TMPDIR" && npm ci

      - name: Set up Python for real training bridge tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/training/dspy/requirements.lock

      - name: Install the real DSPy bridge for integration tests
        run: |
          env -u TYPESAFE_API_KEY python -m venv src/training/dspy/.venv
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -m pip install -r src/training/dspy/requirements.lock
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -m pip install --no-deps -e src/training/dspy

      - name: Resolve exact Daimon recovery fixture revision
        id: daimon-fixture
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const ref = parse(readFileSync('runtimes.yaml', 'utf8')).runtimes.daimon.ref;
          if (!/^[a-f0-9]{40}$/.test(ref)) throw Error('Daimon recovery requires a full commit pin');
          console.log(`ref=${ref}`);
          NODE

      - name: Check out pinned Daimon recovery fixture
        uses: actions/checkout@v4
        with:
          repository: noopolis/daimon-harness
          ref: ${{ steps.daimon-fixture.outputs.ref }}
          path: .tmp/daimon-source

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Enable cross-architecture helper builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild dual-architecture native helpers
        run: npm run build:native

      - name: Build
        run: npm run build

      - name: Verify native helper syscalls
        run: node --experimental-strip-types --test scripts/native-helper-artifacts.test.ts scripts/native-helper-integration.test.ts

      - name: Verify maintained TypeScript scripts
        run: npm run test:scripts

      # Preseed reads the candidate volume through its Docker Mountpoint and
      # relies on host rename/fsync/hardlink semantics a container cannot give
      # it. On a rootful Linux daemon /var/lib/docker/volumes/*/_data is
      # root-owned 0700, so this needs root — it passes unprivileged on macOS
      # only because Docker runs in a VM there.
      - name: Verify named-volume product-state preseed
        run: sudo -E env "PATH=$PATH" npm run test:product-state-volume

      - name: Boundary tests
        run: npm run test:boundaries

      - name: Coverage
        run: npm run coverage

  training-python:
    name: DSPy bridge tests and per-module coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Spawnfile
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/training/dspy/requirements.lock
      - name: Install the locked DSPy bridge
        run: |
          env -u TYPESAFE_API_KEY python -m venv src/training/dspy/.venv
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -m pip install -r src/training/dspy/requirements.lock
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -m pip install --no-deps -e src/training/dspy
      - name: Test the bridge and enforce per-module Python coverage
        run: env -u TYPESAFE_API_KEY npm run test:training-python
