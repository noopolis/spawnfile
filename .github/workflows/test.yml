name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-message:
    name: Commit messages and author allowlist
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out pull request head with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check every pull request commit before install
        run: node .github/scripts/ci/commit-message.mts --range "origin/$GITHUB_BASE_REF..HEAD"
      - name: Test commit policy
        run: |
          mkdir -p .tmp-commit-check
          TMPDIR="$PWD/.tmp-commit-check" node --test .github/scripts/ci/commit-message.test.mts

  root:
    name: compiler + runtime tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
      DAIMON_SOURCE_ROOT: ${{ github.workspace }}/.tmp/daimon-source
    steps:
      - name: Check out Spawnfile
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: mkdir -p "$TMPDIR" && npm ci

      - name: Set up Python for real training bridge tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/training/dspy/requirements.lock

      - name: Install the real DSPy bridge for integration tests
        run: |
          env -u TYPESAFE_API_KEY python -m venv src/training/dspy/.venv
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -m pip install -r src/training/dspy/requirements.lock
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -m pip install --no-deps -e src/training/dspy

      - name: Resolve exact Daimon parity and recovery fixture revision
        id: daimon-fixture
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const ref = parse(readFileSync('runtimes.yaml', 'utf8')).runtimes.daimon.ref;
          if (!/^[a-f0-9]{40}$/.test(ref)) throw Error('Daimon recovery requires a full commit pin');
          console.log(`ref=${ref}`);
          NODE

      - name: Check out pinned Daimon parity and recovery fixture
        uses: actions/checkout@v4
        with:
          repository: noopolis/daimon-harness
          ref: ${{ steps.daimon-fixture.outputs.ref }}
          path: .tmp/daimon-source

      - name: Verify generated Daimon descriptors against the exact runtime pin
        env:
          SPAWNFILE_DAIMON_SOURCE_DIR: ${{ github.workspace }}/.tmp/daimon-source
        run: env -u TYPESAFE_API_KEY npm run vendor:daimon-engine-descriptors -- --check

      - name: Build pinned Daimon for training parity tests
        working-directory: .tmp/daimon-source
        run: env -u TYPESAFE_API_KEY npm ci && env -u TYPESAFE_API_KEY npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Enable cross-architecture helper builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild dual-architecture native helpers
        run: npm run build:native

      - name: Build
        run: npm run build

      - name: Verify native helper syscalls
        run: node --experimental-strip-types --test scripts/native-helper-artifacts.test.ts scripts/native-helper-integration.test.ts

      - name: Verify maintained TypeScript scripts
        run: npm run test:scripts

      # Preseed reads the candidate volume through its Docker Mountpoint and
      # relies on host rename/fsync/hardlink semantics a container cannot give
      # it. On a rootful Linux daemon /var/lib/docker/volumes/*/_data is
      # root-owned 0700, so this needs root — it passes unprivileged on macOS
      # only because Docker runs in a VM there.
      - name: Verify named-volume product-state preseed
        run: sudo -E env "PATH=$PATH" npm run test:product-state-volume

      - name: Boundary tests
        run: npm run test:boundaries

      - name: Coverage
        env:
          # Parity loads built modules; recovery separately reads pinned Git source.
          SPAWNFILE_DAIMON_CHECKOUT: ${{ github.workspace }}/.tmp/daimon-source
        run: env -u TYPESAFE_API_KEY npm run coverage

  training-python:
    name: DSPy bridge tests and per-module coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Spawnfile
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/training/dspy/requirements.lock
      - name: Install the locked DSPy bridge
        run: |
          env -u TYPESAFE_API_KEY python -m venv src/training/dspy/.venv
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -m pip install -r src/training/dspy/requirements.lock
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -m pip install --no-deps -e src/training/dspy
      - name: Verify renamed DSPy package and console script
        run: |
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -c 'import importlib.metadata, spawnfile_training_dspy; assert importlib.metadata.distribution("spawnfile-training-dspy-bridge").entry_points["spawnfile-training-dspy"].value == "spawnfile_training_dspy.main:cli"'
          env -u TYPESAFE_API_KEY src/training/dspy/.venv/bin/python -c 'import json, subprocess; result=subprocess.run(["src/training/dspy/.venv/bin/spawnfile-training-dspy"], input="{}\n", capture_output=True, text=True, check=False); terminal=json.loads(result.stdout); assert result.returncode == 1 and terminal["schema"] == "spawnfile.training.dspy.v2" and terminal["error"]["code"] == "invalid_request"'
      - name: Test the bridge and enforce per-module Python coverage
        run: env -u TYPESAFE_API_KEY npm run test:training-python

  # Run the release gate on every PR/main revision: ~6 runner minutes in
  # parallel with coverage, with no path filter that can miss an upstream move.
  source-provenance:
    name: offline source provenance (linux/amd64)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out Spawnfile
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: env -u TYPESAFE_API_KEY npm ci

      # Uses the checked-in native helpers, as the shipped package does.
      # The root job separately rebuilds and syscall-tests both architectures.
      - name: Build
        run: env -u TYPESAFE_API_KEY npm run build

      - name: Resolve exact Daimon provenance fixture revision
        id: daimon-provenance
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const ref = parse(readFileSync('runtimes.yaml', 'utf8')).runtimes.daimon.ref;
          if (!/^[a-f0-9]{40}$/.test(ref)) throw Error('Daimon provenance requires a full commit pin');
          console.log(`ref=${ref}`);
          NODE

      - name: Check out Daimon provenance fixture
        uses: actions/checkout@v4
        with:
          repository: noopolis/daimon-harness
          ref: ${{ steps.daimon-provenance.outputs.ref }}
          path: daimon-fixture

      # The shipped runtime refuses any Grok executable but the manifest-pinned
      # build, so the source build needs the real linux-x86_64 binary. Its URL,
      # size, and digest come from the vendored Daimon contract manifest, so a
      # re-vendored Daimon bump moves this download with no CI edit.
      - name: Fetch the pinned linux-x86_64 Grok CLI
        id: grok-cli
        shell: bash
        run: |
          set -euo pipefail

          manifest=src/runtime/daimon/contract-manifest.json
          read -r url bytes sha256 < <(node -e '
            const artifact = require("./" + process.argv[1]).grokEngineBroker?.grokCliArtifacts?.x64;
            if (typeof artifact?.url !== "string" || !Number.isInteger(artifact.bytes) || !/^[a-f0-9]{64}$/.test(artifact.sha256 ?? "")) {
              throw new Error("vendored Daimon contract manifest has no pinned linux-x86_64 Grok CLI artifact");
            }
            process.stdout.write(`${artifact.url} ${artifact.bytes} ${artifact.sha256}\n`);
          ' "${manifest}")

          file="${RUNNER_TEMP}/grok"
          curl --fail --location --silent --show-error --output "${file}" -- "${url}"
          test "$(stat -c %s -- "${file}")" -eq "${bytes}"
          echo "${sha256}  ${file}" | sha256sum --check --strict -
          chmod 0755 -- "${file}"
          echo "file=${file}" >> "${GITHUB_OUTPUT}"

      - name: Verify Git-free offline linux/amd64 source build
        env:
          SPAWNFILE_GROK_CLI_FILE: ${{ steps.grok-cli.outputs.file }}
          SPAWNFILE_TEST_DAIMON_SOURCE: ${{ github.workspace }}/daimon-fixture
        run: env -u TYPESAFE_API_KEY npm run test:source-provenance-docker

      - name: Remove Daimon provenance fixture and Grok CLI
        if: always()
        run: rm -rf -- daimon-fixture "${RUNNER_TEMP}/grok"
