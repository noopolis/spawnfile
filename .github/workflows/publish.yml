name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Enable cross-architecture helper builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag ${RELEASE_TAG} is not a supported version tag."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Rebuild dual-architecture native helpers
        run: npm run build:native

      - name: Build
        run: npm run build

      - name: Verify Git-free offline linux/amd64 source build
        run: npm run test:source-provenance-docker

      - name: Check out Moltnet provenance fixture
        uses: actions/checkout@v4
        with:
          repository: noopolis/moltnet
          path: moltnet-fixture

      - name: Verify Git-free offline linux/amd64 Moltnet build
        env:
          SPAWNFILE_TEST_MOLTNET_SOURCE: ${{ github.workspace }}/moltnet-fixture
        run: npm run test:moltnet-source-provenance-docker

      - name: Remove Moltnet provenance fixture
        if: always()
        run: rm -rf -- moltnet-fixture

      - name: Verify native helper syscalls
        run: node --test scripts/native-helper-artifacts.test.mjs scripts/native-helper-integration.test.mjs

      - name: Verify package contents
        run: npm run verify:package-closure

      - name: Publish to npm
        # Full typecheck and test coverage run on pull requests and main.
        # This tag job publishes only the artifact built and verified above.
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
