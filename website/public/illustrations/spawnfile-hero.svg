.l{opacity:0;animation:show 12s infinite}
@keyframes show{0%{opacity:0}4%{opacity:1}88%{opacity:1}94%{opacity:0}100%{opacity:0}}
.p{animation:fly 12s infinite}
@keyframes fly{0%{transform:translateX(0);opacity:1}8%{transform:translateX(128px);opacity:1}9%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.p{animation:none;opacity:0}}
