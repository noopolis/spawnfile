# Runtime registry
#
# Each entry pins the stable version of a runtime that the Spawnfile
# compiler currently targets or is researching.
#
# Fields:
#   remote          Git clone URL
#   ref             Pinned git ref — should be the latest stable tag
#   default_branch  The repo's main branch (for fetch)
#   install         Pinned install strategy for the verified runtime version
#   status          active (has adapter) | exploratory (research only)
#
runtimes:
  daimon:
    remote: git@github.com:noopolis/daimon-harness.git
    ref: 9e98f4fc0d8ac3f38bc8d53dcfc517bc17ccf7a7
    default_branch: main
    install:
      kind: container_image
      image: noopolis/spawnfile-runtime-daimon
      tag: 0.2.7-9e98f4f
      digest: sha256:70a7f5c8f5cc8d65799f740a67ace49a59842bf5f9f0a4dc9ffda7b20c80556c
      capability_receipts:
        amd64: sha256:687b6b95adf18ac00e244011cc488c779ef41a436cede31d61620517db54497a
        arm64: sha256:08adc74fdb926e577cffca9446e470752d1ffa3c5addb20f2af730135555ef36
      contract_manifest_sha256: sha256:e39551277c6727c8807b1247e759f57addcee3f17f1405ebc927179647d64de6
    status: active

  openclaw:
