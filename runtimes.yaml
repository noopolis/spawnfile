# Runtime registry
#
# Each entry pins the stable version of a runtime that the Spawnfile
# compiler currently targets or is researching.
#
# Fields:
#   remote          Git clone URL
#   ref             Pinned git ref — should be the latest stable tag
#   default_branch  The repo's main branch (for fetch)
#   install         Pinned install strategy for the verified runtime version
#   status          active (has adapter) | exploratory (research only)
#
runtimes:
  daimon:
    remote: git@github.com:noopolis/daimon.git
    ref: v0.2.0
    default_branch: main
    install:
      kind: container_image
      image: noopolis/spawnfile-runtime-daimon
      tag: 0.2.0
      digest: sha256:19b671e589ad8c9e8f1b55610ccbf86ee72f16b4cb2f707ec419f5ef0d6942aa
      capability_receipt: sha256:1a207c0cc5f081b2a8f941d59b74e37f905a1dc7b37a08c7984c6e39123fb4e7
    status: active

  openclaw:
    remote: git@github.com:openclaw/openclaw.git
    ref: v2026.6.11
    default_branch: main
    install:
      kind: container_image
      image: noopolis/spawnfile-runtime-openclaw
      tag: 2026.6.11
    status: active

  picoclaw:
    remote: git@github.com:sipeed/picoclaw.git
    ref: v0.3.1
    default_branch: main
    install:
      kind: container_image
      image: noopolis/spawnfile-runtime-picoclaw
      tag: 0.3.1
    status: active

  pi:
    remote: git@github.com:earendil-works/pi.git
    ref: v0.79.10
    default_branch: main
    install:
      kind: npm
      package: "@earendil-works/pi-coding-agent"
      version: 0.79.10
    status: active

  hermes-agent:
    remote: git@github.com:NousResearch/hermes-agent.git
    ref: v2026.6.5
    default_branch: main
    status: exploratory

  opencode:
    remote: git@github.com:anomalyco/opencode.git
    ref: v1.16.2
    default_branch: dev
    status: exploratory

  openfang:
    remote: git@github.com:RightNow-AI/openfang.git
    ref: v0.6.9
    default_branch: main
    status: exploratory
